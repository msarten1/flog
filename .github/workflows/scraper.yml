name: Actualizar torneos

on:
  schedule:
    # Cada día a las 06:00 UTC (07:00 en invierno / 08:00 en verano, hora de Madrid)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: "Enviar notificaciones push"
        type: boolean
        default: true
      dry_run:
        description: "Solo mostrar cambios, sin escribir ni notificar"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/pyproject.toml

      - name: Instalar scraper
        run: pip install -e scraper

      - name: Ejecutar scraper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FLOG_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m flog_scraper -v run --dry-run
          else
            python -m flog_scraper -v run
          fi

      - name: Notificaciones push
        if: inputs.dry_run != true && inputs.notify != false
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FCM_SERVICE_ACCOUNT_JSON" ]; then
            echo "FCM_SERVICE_ACCOUNT_JSON no configurado: se omiten las notificaciones"
          else
            python -m flog_scraper notify
          fi

      - name: Publicar datos
        if: inputs.dry_run != true
        run: |
          git config user.name "flog-bot"
          git config user.email "flog-bot@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "Sin cambios en data/"
          else
            git add data/
            git commit -m "data: actualización $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changes
          path: data/changes.json
          if-no-files-found: ignore

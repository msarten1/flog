name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/pyproject.toml
      - run: pip install -e "scraper[dev]"
      - run: pytest scraper/tests -q

  app:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('app/pubspec.yaml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flog-scraper"
version = "0.1.0"
description = "Scraper de torneos de golf amateur de la Comunitat Valenciana para la app Flog"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "rapidfuzz>=3.9",
    "openai>=1.50",
    "google-auth>=2.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]

[project.scripts]
flog-scraper = "flog_scraper.__main__:main"

[tool.setuptools.packages.find]
include = ["flog_scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario de golf amateur · Comunitat Valenciana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f0; --card:#ffffff; --ink:#1c2420; --muted:#66706a; --line:#e3e2da;
    --green:#1f5b3a; --green-soft:#e4efe7; --sand:#efe7d6;
    --fed:#1f5b3a; --club:#7a5a1f; --circ:#2e5a8a; --nac:#7b3b6b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121614; --card:#1b201d; --ink:#e9ece9; --muted:#9aa49e; --line:#2b322e;
      --green:#7cc79a; --green-soft:#21352a; --sand:#2a271f;
      --fed:#7cc79a; --club:#d9b36a; --circ:#8db7e6; --nac:#d49ac4; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
  header h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:26px;margin:4px 0 4px;letter-spacing:-.01em}
  header p{margin:0;color:var(--muted);font-size:13px}
  .stats{display:flex;gap:8px;margin:16px 0 4px;flex-wrap:wrap}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex:1;min-width:120px}
  .stat b{display:block;font-size:20px}
  .stat span{color:var(--muted);font-size:12px}
  .controls{position:sticky;top:0;background:var(--bg);padding:12px 0 10px;z-index:2;border-bottom:1px solid var(--line);margin-bottom:8px}
  input[type=search]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font:500 13px Inter,sans-serif;cursor:pointer}
  .chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
  @media (prefers-color-scheme: dark){ .chip[aria-pressed=true]{color:#0f1a14} }
  h2.month{font:600 13px Inter,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px}
  .ev{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
  .date{flex:0 0 52px;text-align:center;background:var(--sand);border-radius:10px;padding:6px 0;align-self:flex-start}
  .date .d{font:700 20px Inter,sans-serif;line-height:1.1}
  .date .w{font-size:11px;color:var(--muted);text-transform:uppercase}
  .body{min-width:0;flex:1}
  .title{font-weight:600;margin:0 0 2px}
  .meta{color:var(--muted);font-size:13px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
  .t-Federación{color:var(--fed)} .t-Club{color:var(--club)} .t-Circuito{color:var(--circ)} .t-Nacional{color:var(--nac)}
  .new{background:#d4572a;color:#fff;border-color:#d4572a}
  .insc{font-size:13px;margin-top:6px}
  a{color:var(--green)}
  .link{font-size:13px;font-weight:600;display:inline-block;margin-top:6px}
  .empty{color:var(--muted);text-align:center;padding:30px 0}
  footer{margin-top:32px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
  footer ul{padding-left:18px;margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Golf amateur · Comunitat Valenciana</h1>
    <p id="upd">Cargando…</p>
  </header>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Buscar torneo o club…" aria-label="Buscar">
    <div class="chips" id="prov"></div>
    <div class="chips" id="tipo"></div>
  </div>
  <main id="list"></main>
  <footer>
    <div id="nota"></div>
    <div style="margin-top:8px">Fuentes:</div>
    <ul id="fuentes"></ul>
    <div>Confirma siempre fecha e inscripción en la ficha del club o de la federación.</div>
  </footer>
</div>
<script>
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS=["dom","lun","mar","mié","jue","vie","sáb"];
const state={q:"",prov:"Todas",tipo:"Todos",nuevos:false};
let DATA=null;
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=d=>d.getDate()+" "+MESES[d.getMonth()];
function isNew(t){const a=parse(t.anadido),u=parse(DATA.actualizado);return (u-a)/864e5<7 && DATA.primera!==DATA.actualizado}
function chips(el,opts,key){
  el.innerHTML="";
  opts.forEach(o=>{const b=document.createElement("button");b.className="chip";b.textContent=o.label;
    b.setAttribute("aria-pressed",String(o.val===state[key]));
    b.onclick=()=>{state[key]=(key==="nuevos")?!state.nuevos:o.val;render()};el.appendChild(b)});
}
function render(){
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const fut=DATA.torneos.filter(t=>parse(t.fecha_fin||t.fecha)>=hoy).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const provs=["Todas","Alicante","Valencia","Castellón"];
  const tipos=["Todos",...new Set(fut.map(t=>t.tipo))];
  chips(document.getElementById("prov"),provs.map(p=>({label:p,val:p})),"prov");
  const tEl=document.getElementById("tipo");chips(tEl,tipos.map(p=>({label:p,val:p})),"tipo");
  const nb=document.createElement("button");nb.className="chip";nb.textContent="Solo nuevos";nb.setAttribute("aria-pressed",String(state.nuevos));
  nb.onclick=()=>{state.nuevos=!state.nuevos;render()};tEl.appendChild(nb);
  const q=state.q.trim().toLowerCase();
  const rows=fut.filter(t=>(state.prov==="Todas"||t.provincia===state.prov)&&(state.tipo==="Todos"||t.tipo===state.tipo)
    &&(!state.nuevos||isNew(t))&&(!q||(t.nombre+" "+t.club).toLowerCase().includes(q)));
  const nNew=fut.filter(isNew).length;
  const next=fut[0];
  document.getElementById("stats").innerHTML=
    `<div class="stat"><b>${fut.length}</b><span>torneos próximos</span></div>`+
    `<div class="stat"><b>${nNew}</b><span>nuevos esta semana</span></div>`+
    (next?`<div class="stat"><b>${fmt(parse(next.fecha))}</b><span>${esc(next.nombre)}</span></div>`:"");
  const list=document.getElementById("list");list.innerHTML="";
  if(!rows.length){list.innerHTML='<div class="empty">No hay torneos con estos filtros.</div>';return}
  let cur="";
  rows.forEach(t=>{
    const d=parse(t.fecha),key=d.getFullYear()+"-"+d.getMonth();
    if(key!==cur){cur=key;const h=document.createElement("h2");h.className="month";h.textContent=MESES[d.getMonth()]+" "+d.getFullYear();list.appendChild(h)}
    const fin=t.fecha_fin?` – ${fmt(parse(t.fecha_fin))}`:"";
    const el=document.createElement("article");el.className="ev";
    el.innerHTML=`<div class="date"><div class="d">${d.getDate()}</div><div class="w">${DIAS[d.getDay()]}</div></div>
      <div class="body"><p class="title">${esc(t.nombre)}</p>
      <div class="meta">${esc(t.club)} · ${esc(t.provincia)}${fin?` · hasta ${fin.slice(3)}`:""}${t.modalidad?` · ${esc(t.modalidad)}`:""}</div>
      <div class="tags"><span class="tag t-${t.tipo.split(" ")[0]}">${esc(t.tipo)}</span>${isNew(t)?'<span class="tag new">Nuevo</span>':""}${t.cambio?`<span class="tag new">${esc(t.cambio)}</span>`:""}</div>
      ${t.inscripcion?`<div class="insc">${esc(t.inscripcion)}</div>`:""}
      ${t.enlace?`<a class="link" href="${t.enlace}" target="_blank" rel="noopener">Ver ficha →</a>`:""}</div>`;
    list.appendChild(el);
  });
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render()});
fetch("torneos.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{
  DATA=j;
  document.getElementById("upd").textContent="Actualizado el "+fmt(parse(j.actualizado))+" "+parse(j.actualizado).getFullYear()+" · se revisa cada lunes";
  document.getElementById("nota").textContent=j.nota||"";
  document.getElementById("fuentes").innerHTML=(j.fuentes||[]).map(f=>`<li><a href="${f.url}" target="_blank" rel="noopener">${esc(f.nombre)}</a></li>`).join("");
  render();
}).catch(()=>{document.getElementById("upd").textContent="No se pudo cargar el calendario."});
</script>
</body>
</html>
